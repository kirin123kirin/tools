[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tools"
version = "0.1.0"
description = "Collection of Python processing utilities"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pillow>=10",
    "rembg[cpu]>=2.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pywin32>=306",
    "janome>=0.5",        # cwc -w / --hinshi 用、遅延インポート
    "wordcloud>=1.9",
    "tokenizers>=0.15",   # cwc --similar 用、遅延インポート
    "onnxruntime>=1.17",  # cwc --similar 用、遅延インポート（rembg経由でも入るが直接使うので明示）
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "scikit-learn>=1.4",  # cwc --similar の自前クラスタリング実装の正しさ検証用
]

[project.scripts]
tools = "tools.cli:main"
# サブコマンドごとの単体エントリーポイント（例: `denoise.exe`）。
# 新しい処理を processing/ に追加したら、ここにも同名のエントリーを追加すること。
touka = "tools.cli:run_as_subcommand"
denoise = "tools.cli:run_as_subcommand"
kukiri = "tools.cli:run_as_subcommand"
cwc = "tools.cli:run_as_subcommand"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tools.data" = ["*.dic", "*.tsv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workpytools"
version = "0.1.20"
description = "Collection of Python processing utilities"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "pillow>=10",
    "rembg[cpu]>=2.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pywin32>=306",
    "janome>=0.5",        # cwc -w / --hinshi 用、遅延インポート
    "wordcloud>=1.9",
    "tokenizers>=0.15",   # cwc --similar 用、遅延インポート
    "onnxruntime>=1.17",  # cwc --similar 用、遅延インポート（rembg経由でも入るが直接使うので明示）
    "markdown-it-py>=3",    # clipmd/clipview 用、遅延インポート
    "markdownify>=0.13",    # clipmd/clipview 用、遅延インポート
    "beautifulsoup4>=4.12", # clipmd のHTML前処理パス用、遅延インポート（markdownify経由で入るが直接使うので明示）
    "mdformat>=0.7",         # clipfmt 用、遅延インポート
    "mdformat-tables>=1",    # clipfmt 用、遅延インポート
    "openpyxl>=3.1",         # profiler のExcel入力用、遅延インポート
    "xlsxwriter>=3",         # profiler/lsdir のExcel出力用、遅延インポート
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "scikit-learn>=1.4",  # cwc --similar の自前クラスタリング実装の正しさ検証用
]

[project.scripts]
tools = "workpytools.cli:main"
# サブコマンドごとの単体エントリーポイント（例: `denoise.exe`）。
# 新しい処理を processing/ に追加したら、ここにも同名のエントリーを追加すること。
touka = "workpytools.cli:run_as_subcommand"
denoise = "workpytools.cli:run_as_subcommand"
kukiri = "workpytools.cli:run_as_subcommand"
cwc = "workpytools.cli:run_as_subcommand"
clipmd = "workpytools.cli:run_as_subcommand"
mdtsv = "workpytools.cli:run_as_subcommand"
clipview = "workpytools.cli:run_as_subcommand"
clipfmt = "workpytools.cli:run_as_subcommand"
vv = "workpytools.cli:run_as_subcommand"
profiler = "workpytools.cli:run_as_subcommand"
lsdir = "workpytools.cli:run_as_subcommand"
outline = "workpytools.cli:run_as_subcommand"
ikko = "workpytools.cli:run_as_subcommand"
mokuji = "workpytools.cli:run_as_subcommand"
tbl = "workpytools.cli:run_as_subcommand"
seiretsu = "workpytools.cli:run_as_subcommand"
nagasa = "workpytools.cli:run_as_subcommand"
umekomi = "workpytools.cli:run_as_subcommand"
merioall = "workpytools.cli:run_as_subcommand"
iro = "workpytools.cli:run_as_subcommand"
shortcut = "workpytools.cli:run_as_subcommand"
# help コマンドの単体エントリーポイントのみ toolh という別名にする
# （run_as_subcommand内の_ENTRY_POINT_ALIASESでhelpにマッピングされる）。
toolh = "workpytools.cli:run_as_subcommand"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"workpytools.data" = ["*.dic", "*.tsv", "*.ico", "*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
